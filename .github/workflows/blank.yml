name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Inspect what files exist in the repository
      - name: Check Repository Structure
        run: |
          echo "=== Files in Repository ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: |
          # If files were uploaded inside a subfolder, navigate into it
          if [ -d "android_pdf_scanner" ]; then
            echo "Entering android_pdf_scanner directory..."
            cd android_pdf_scanner
          fi

          # Verify that Gradle settings exist
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::CRITICAL: Android project files are missing from this repository!"
            echo "::error::Make sure you upload 'app', 'build.gradle.kts', and 'settings.gradle.kts'."
            exit 1
          fi

          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pro-PDF-Scanner-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            android_pdf_scanner/app/build/outputs/apk/debug/app-debug.apk
