name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub UI

jobs:
  build:
    name: Compile & Package APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository files onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Step 3: Install Android SDK Build-Tools & Platform Tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Make sure gradlew has executable permissions
      - name: Make Gradlew Executable
        run: chmod +x gradlew || true

      # Step 5: Build Debug APK with Gradle
      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # Step 6: Upload the generated APK so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pro-PDF-Scanner-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
